
name: Run Django Tests (Docker)

on:
  pull_request:
    branches: [ "**" ]

jobs:
  django-test:
    name: django testing
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: setup python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        pip install -r src/requirements.txt
    - name: Install dev dependencies
      run: |
        pip install -r src/requirements-dev.txt
    - name: Collect static files
      run: |
        python src/manage.py collectstatic --noinput
    - name: Build the Docker image
      run: |
        docker compose build
    - name: Copy the env files
      run: |
        cp .dockerenv/.django.env.example .dockerenv/.django.env
        cp .dockerenv/.postgres.env.example .dockerenv/.postgres.env
    - name: Run the Docker containers
      run: |
        docker compose up -d
    - name: Install dev dependencies in the Docker container
      run: |
        docker compose exec socialnetwork pip install -r requirements-dev.txt
    - name: Run all tests
      run: |
        docker compose exec socialnetwork python manage.py test --parallel --exclude-tag=ui
