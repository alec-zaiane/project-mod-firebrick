
name: Run Django Tests

on:
  pull_request:
    branches: [ "**" ]

jobs:
  django-test-no-ui:
    name: django testing
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: setup python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        pip install -r src/requirements.txt
    - name: Install dev dependencies
      run: |
        pip install -r src/requirements-dev.txt
    - name: Collect static files
      run: |
        python src/manage.py collectstatic --noinput
    - name: patch requirements-dev into requirements (for testing)
      run: |
        cat src/requirements-dev.txt >> src/requirements.txt
    - name: Build the Docker image
      run: |
        docker compose build
    - name: Copy the env files
      run: |
        cp .dockerenv/.django.env.example .dockerenv/.django.env
        cp .dockerenv/.postgres.env.example .dockerenv/.postgres.env
        cp .dockerenv/.django.env.nosecrets.example .dockerenv/.django.env.nosecrets
    - name: Run the Docker containers
      run: |
        docker compose up -d
    - name: Run all tests
      run: |
        docker compose run -T socialnetwork pytest -n auto -m "not ui" --cov=src --cov-report=txt
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-no-ui
        path: coverage.txt
        overwrite: true


  # https://chrisguitarguy.com/2023/01/13/docker-compose-exec-on-github-actions/
  django-test-ui:
    name: django testing
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: setup python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install geckodriver
      uses: browser-actions/setup-geckodriver@latest

    - name: Install dependencies
      run: |
        pip install -r src/requirements.txt
    - name: Install dev dependencies
      run: |
        pip install -r src/requirements-dev.txt
    - name: Collect static files
      run: |
        python src/manage.py collectstatic --noinput
    - name: Run all tests
      run: |
        pytest src -n auto -m "ui" --cov=src --cov-report=txt
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-ui
        path: coverage.txt
        overwrite: true

  show-coverage:
    # Written with ChatGPT: Can I send a message to the pull request that an action has run from?
    name: comment coverage on PR
    runs-on: ubuntu-latest
    needs: [django-test-no-ui, django-test-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-no-ui
          path: coverage-no-ui
      - uses: actions/download-artifact@v4
        with:
          name: coverage-ui
          path: coverage-ui
      - name: format coverage report
        run: |
            echo "## Coverage report" > coverage-report.md
            echo "" >> coverage-report.md
            echo "### Non-UI tests (inside docker)" >> coverage-report.md
            echo "" >> coverage-report.md
            echo "\`\`\`" >> coverage-report.md
            cat coverage-no-ui/coverage.txt >> coverage-report.md
            echo "\`\`\`" >> coverage-report.md
            echo "" >> coverage-report.md
            echo "### UI tests (outside docker)" >> coverage-report.md
            echo "" >> coverage-report.md
            echo "\`\`\`" >> coverage-report.md
            cat coverage-ui/coverage.txt >> coverage-report.md
            echo "\`\`\`" >> coverage-report.md
      - name: comment coverage on PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: coverage-report.md
