<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Social Network</title>
    {% load static %}
</head>
<body>
    <div class="navbar">
        <a href="{% url 'socialnetwork:stream' %}">Home</a>
        {% if author %}
            <a href="{% url 'socialnetwork:author_profile' author.uuid %}">Profile</a>
        {% endif %}
        <form action="{% url 'logout' %}" method="post" style="display: inline;">
            {% csrf_token %}
            <button type="submit">Log Out</button>
        </form>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
