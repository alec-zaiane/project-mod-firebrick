{% extends 'base.html' %}

{% block content %}
<div class="stream-container">
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log Out</button>
    </form>
    <h1>Your Stream</h1>
    
    {% if posts %}
        {% for post in posts %}
        {% include 'components/post_card.html' %}
        {% endfor %}
    {% else %}
        <p>No posts available in your stream.</p>
    {% endif %}

</div>
{% endblock %}
