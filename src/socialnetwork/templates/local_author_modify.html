{# expects author and viewer objects, both of type socialnetwork.models.LocalAuthor #}

{% extends "base.html" %}

{% load static %}

{% block title %}Modify Author{% endblock %}

{% block content %}
<h1>Modify {{ author.username}} </h1>
<form name="generic-form" action="{% url 'socialnetwork:api_author_update' author.uuid %}">
    {% csrf_token %}
    <div name="response-detail"></div>
    <div name="errorresponse-error"></div>
    <input type="hidden" name="_method" value="PUT">
    <input type="hidden" name="user" value="{{ author.uuid }}">
    <br>
    <label for="username">Username:</label>
    <div name="errorresponse-author__user__username"></div>
    <input type="text" id="username" name="username" value="{{ author.username }}" required>
    <br>
    <label for="email">Email:</label>
    <div name="errorresponse-author__user__email"></div>
    <input type="email" id="email" name="email" value="{{ author.user.email }}" required>
    <br>
    <label for="first_name">First Name:</label>
    <div name="errorresponse-author__user__first_name"></div>
    <input type="text" id="first_name" name="first_name" value="{{ author.user.first_name }}" required>
    <br>
    <label for="last_name">Last Name:</label>
    <div name="errorresponse-author__user__last_name"></div>
    <input type="text" id="last_name" name="last_name" value="{{ author.user.last_name }}" required>
    <br>
    <label for="bio">Bio:</label>
    <div name="errorresponse-author__bio"></div>
    <textarea id="bio" name="bio">{{ author.bio }}</textarea>
    <input type="submit" value="Submit">
    <a href="{% url 'socialnetwork:author_profile' author.uuid %}">Cancel</a>
</form>
{% endblock %}
