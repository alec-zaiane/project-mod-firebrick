<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Public Hosted Images</title>
</head>
<body>
    <h1>Public Hosted Images</h1>
    <p>Anyone can view and copy these image URLs for CommonMark posts!</p>
    <ul>
        {% for image in images %}
        <li>
            <strong>{{ image.title|default:"(No Title)" }}</strong><br>
            <img src="{{ image.image.url }}" alt="{{ image.title }}" style="max-width:200px;"><br>
            <a href="{{ image.image.url }}" target="_blank">Get Image URL</a><br>
        </li>
        {% empty %}
        <li>No images have been hosted yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
