{% extends 'navbar-base.html' %}

{% load static %}

{% block content %}
<div class="stream-container">
    {% if posts %}
    {% for post in posts %}
    {% include 'components/post_card.html' %}
    {% endfor %}
    {% else %}
    <p>No posts available in your stream.</p>
    {% endif %}

</div>

<script src="{% static 'scripts/generic-form.min.js' %}"></script>
<script src="{% static 'scripts/posts.min.js' %}"></script>
<script src="{% static 'scripts/markdown-renderer.min.js' %}"></script>

{% endblock %}
