[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
FAIL_INVALID_TEMPLATE_VARS=true

# Uncomment the following line to enable debug mode if needed
# django_debug_mode = true

markers = [
    "api: mark a test as an API test",
    "bugfix: mark a test as a bugfix",
    "security: mark a test as a security test",
    "ui: mark a test as a UI test",
    "node2node: mark a test as a node2node test",

    "US-identity: mark a test as a US-identity test",
    "US-posting: mark a test as a US-posting test",
    "US-reading: mark a test as a US-reading test",
    "US-visibility: mark a test as a US-visibility test",
    "US-sharing: mark a test as a US-sharing test",
    "US-following/friends: mark a test as a US-following/friends test",
    "US-comments/likes: mark a test as a US-comments/likes test",
    "US-node-management: mark a test as a US-node-management test",

    "check-fast: mark a test as one to be run in the fast suite",
    "check-medium: mark a test as one to be run in the medium suite",
    "check-slow: mark a test as one to be run in the slow suite",
]

# generated by copilot
filterwarnings = [
    "ignore:The default scheme will be changed from 'http' to 'https' in Django 6.0.:django.utils.deprecation.RemovedInDjango60Warning",
]
