{% extends 'base.html' %}
{% block title %}Friends of {{ author.username }}{% endblock %}
{% block content %}
<main class="friends-list">
    <h2>Friends of {{ author.username }}</h2>
    {% if friends %}
        <ul>
            {% for friend in friends %}
                <li><a href="{% url 'socialnetwork:author_profile' friend.uuid %}">{{ friend.username }}</a></li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No friends yet.</p>
    {% endif %}
</main>
{% endblock %}
