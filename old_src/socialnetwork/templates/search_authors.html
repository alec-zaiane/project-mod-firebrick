{% extends "base.html" %}
{% load static %}

{% block title %}AJAX Author Search{% endblock %}

{% block content %}
<h2>Search Authors (AJAX)</h2>
<input type="text" id="searchInput" placeholder="Enter username or display name">
<ul id="results"></ul>
{% endblock %}

{% block script %}
<script>
  // Listen for input events on the search field
  document.getElementById("searchInput").addEventListener("input", function(){
    const query = this.value;
    // Only perform search if query is not empty
    if (query.trim() === "") {
      document.getElementById("results").innerHTML = "";
      return;
    }
    fetch(`/api/search/authors/?q=${encodeURIComponent(query)}`)
      .then(response => response.json())
      .then(data => {
        const results = document.getElementById("results");
        results.innerHTML = "";  // Clear previous results
        if(data.length === 0){
          results.innerHTML = "<li>No authors found.</li>";
        } else {
          data.forEach(author => {
            // Display each author's display_name and username
            const li = document.createElement("li");
            li.textContent = `${author.display_name} (${author.user.username})`;
            // Optionally, add a link to the author's profile
            const link = document.createElement("a");
            link.href = `/author/${author.uuid}`;
            link.textContent = "View Profile";
            li.appendChild(document.createTextNode(" - "));
            li.appendChild(link);
            results.appendChild(li);
          });
        }
      })
      .catch(error => console.error("Error:", error));
  });
</script>
{% endblock %}
