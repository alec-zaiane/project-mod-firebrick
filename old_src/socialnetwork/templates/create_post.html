{% extends "base.html" %}

{% load static %}

{% block content %}
<h2>Create a Post</h2>

<!-- Form for Plain Text or Markdown Posts -->
<form id="post-form" action="{% url 'api_textpost_create' %}" method="POST">
    {% csrf_token %}

    <label for="post_type">Post Type:</label>
    <select name="post_type">
        <option value="PT">Plain Text</option>
        <option value="MD">Markdown</option>
    </select>

    <input type="text" name="title" placeholder="Title (optional)">
    <textarea name="content" rows="5" placeholder="Write your post..."></textarea>

    <button type="submit">Create Text Post</button>
</form>

<h3>Preview</h3>
<div id="preview" class="post-card"></div>

<hr>

<!-- Form for Image Upload -->
<h2>Create an Image Post</h2>
<form id="image-upload-form" action="{% url 'api_imagepost_create' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label for="visibility">Visibility:</label>
    <select name="visibility_type">
        <option value="PU">Public</option>
        <option value="FO">Friends Only</option>
        <option value="UN">Unlisted</option>
    </select>

    <label for="image">Upload Image:</label>
    <input type="file" name="image" accept="image/*" required>

    <button type="submit">Create Image Post</button>
</form>

<!-- Display Markdown URL After Upload -->
<div id="markdown-container" style="display:none; margin-top: 15px;">
    <p>Copy this Markdown to reuse your image:</p>
    <textarea id="markdown-output" readonly style="width:100%; height:60px;"></textarea>
</div>

<script src="{% static 'scripts/markdown-editor.min.js' %}"></script>

<!-- JavaScript to Handle Image Upload and Display Markdown -->
<script>
    document.getElementById("image-upload-form").addEventListener("submit", function(event) {
        event.preventDefault();
        let formData = new FormData(this);
        
        fetch(this.action, {
            method: "POST",
            body: formData,
            headers: {
                'X-CSRFToken': document.getElementsByName("csrfmiddlewaretoken")[0].value
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.markdown) {
                document.getElementById("markdown-container").style.display = "block";
                document.getElementById("markdown-output").value = data.markdown;
            } else {
                alert("Failed to upload image.");
            }
        })
        .catch(error => console.error("Error:", error));
    });
</script>

{% endblock %}
